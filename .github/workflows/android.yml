name: Compilar APK Android

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Instalar plataforma Android
        run: sdkmanager 'platforms;android-35'
      - name: Compilar y revisar la APK
        run: gradle --no-daemon :app:lintDebug :app:assembleDebug
      - name: Preparar descargable
        run: cp app/build/outputs/apk/debug/app-debug.apk Monitor_Lumix_USB.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Monitor_Lumix_USB
          path: Monitor_Lumix_USB.apk
          if-no-files-found: error
