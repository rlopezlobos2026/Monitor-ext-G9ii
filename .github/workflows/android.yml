name: Compilar APK Android

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      publicar:
        description: Publicar la versión actual después de las pruebas
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      version: ${{ steps.package.outputs.version }}
      publicar: ${{ steps.package.outputs.publicar }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Compilar y revisar la APK
        run: gradle --no-daemon :app:lintDebug :app:assembleDebug :app:assembleDebugAndroidTest
      - name: Habilitar KVM para el emulador
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Probar efectos y guardado de MP4
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          script: |
            adb shell wm size 709x1536
            adb shell wm density 400
            adb install app/build/outputs/apk/debug/app-debug.apk
            adb install app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
            adb shell am instrument -w cl.monitorexterno.g9ii.monitor.v05.test/cl.monitorexterno.g9ii.MonitorSmoke | tee monitor-smoke.log
            grep -F MONITOR_SMOKE_OK monitor-smoke.log
            adb exec-out run-as cl.monitorexterno.g9ii.monitor.v05 cat files/monitor-ui.png > monitor-ui.png
      - uses: actions/upload-artifact@v4
        with:
          name: Monitor_UI_verification
          path: monitor-ui.png
      - name: Empaquetar APK verificado
        id: package
        env:
          PUBLICAR_MANUAL: ${{ inputs.publicar }}
        run: |
          version=$(sed -nE "s/^[[:space:]]*versionName '([^']+)'.*/\1/p" app/build.gradle)
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          cp app/build/outputs/apk/debug/app-debug.apk "Monitor_Lumix_G9_II_$version.apk"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          publicar=false
          if [[ "$GITHUB_REF" == refs/heads/main ]]; then
            if [[ "$PUBLICAR_MANUAL" == true ]] || { [[ "$GITHUB_EVENT_NAME" == push ]] &&
                 git diff HEAD^ HEAD -- app/build.gradle | grep -E '^\+[[:space:]]*versionName ' > /dev/null; }; then
              publicar=true
            fi
          fi
          echo "publicar=$publicar" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: Monitor_Lumix_USB
          path: Monitor_Lumix_G9_II_${{ steps.package.outputs.version }}.apk
          if-no-files-found: error

  release:
    needs: apk
    if: needs.apk.outputs.publicar == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: Monitor_Lumix_USB
      - name: Publicar versión estable
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.apk.outputs.version }}
        run: |
          tag="v$VERSION"
          apk="Monitor_Lumix_G9_II_$VERSION.apk"
          if gh release view "$tag" > /dev/null 2>&1; then
            gh release view "$tag" --json assets --jq '.assets[].name' | grep -Fx "$apk"
          else
            gh release create "$tag" "$apk" --target "$GITHUB_SHA" --title "Monitor Lumix G9 II $VERSION" \
              --notes "Distribución estable para Android 13 o superior. APK verificado en el emulador. Las decisiones y pruebas pendientes con hardware están en memory/Monitor_Lumix.md." --latest
          fi
