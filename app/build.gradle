plugins {
    id 'com.android.application' version '8.7.3'
}

android {
    namespace 'cl.monitorexterno.g9ii'
    compileSdk 35

    defaultConfig {
        applicationId 'cl.monitorexterno.g9ii.monitor.v05'
        minSdk 33
        targetSdk 34
        versionCode 6
        versionName '1.0.0'
        testInstrumentationRunner "cl.monitorexterno.g9ii.MonitorSmoke"
    }

    buildFeatures {
        buildConfig true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}
